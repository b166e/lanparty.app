<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulador de Pantallas</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    #canvas-container {
      position: relative;
      width: 100%;
      overflow: hidden;
      margin-bottom: 1rem;
      border-radius: .5rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .1);
    }

    #canvas {
      position: relative;
      width: 100%;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: top center;
      transition: height .3s ease;
      background-color: #f5f5f5;
      min-height: 300px;
      border: 2px dashed #aaa;
    }

    #canvas-image {
      display: none;
    }

    .pantalla {
      position: absolute;
      background: rgba(178, 235, 242, .7);
      border: 2px solid var(--secondary-color);
      cursor: move;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: .5em;
      border-radius: .25rem;
      transition: box-shadow .2s, background-color .2s;
      z-index: 10;
    }

    .pantalla.dragging {
      box-shadow: 0 0 15px rgba(0, 0, 0, .4);
      z-index: 100;
      background: rgba(178, 235, 242, .9);
    }

    .etiqueta {
      font-size: .75rem;
      font-weight: bold;
      text-shadow: 0 0 3px white;
    }

    .pantalla small {
      font-size: .625rem;
      text-shadow: 0 0 2px white;
    }

    .zoom-controls {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: flex;
      gap: 5px;
      z-index: 20;
    }

    .zoom-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: white;
      border: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
    }

    .zoom-btn:hover {
      background: #f5f5f5;
    }

    .fit-width-toggle {
      position: absolute;
      top: 10px;
      right: 10px;
      z-index: 20;
      background: white;
      border-radius: 4px;
      padding: 5px 10px;
      font-size: 12px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .users-panel {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 20;
      background: white;
      border-radius: 4px;
      padding: 10px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
      max-height: 300px;
      overflow-y: auto;
      width: 200px;
    }

    .user-item {
      padding: 5px;
      cursor: pointer;
      border-radius: 3px;
      margin-bottom: 3px;
    }

    .user-item:hover {
      background: #f0f0f0;
    }

    .user-item.active {
      background: #e0f0ff;
    }

    /* panel de configuración */
    .config-panel {
      margin-bottom: 1rem;
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .config-panel>div {
      flex: 1;
      min-width: 200px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h2>Distribución de usuarios</h2>

    <div class="config-panel">
      <div>
        <label>Fondo (mapa):</label>
        <input type="file" id="background-image" accept="image/*" class="form-control">
      </div>
      <div>
        <label>Ancho real imagen (cm):</label>
        <input type="number" id="background-width" value="{{ background_width_cm }}" min="10" class="form-control">
      </div>
      <div>
        <label>Factor de escala:</label>
        <input type="number" id="scale-factor" value="{{ scale_factor }}" min="0.1" max="5" step="0.1"
          class="form-control">
      </div>
      <div>
        <div class="form-check">
          <input type="checkbox" id="auto-scale" class="form-check-input" {% if auto_scale %}checked{% endif %}>
          <label class="form-check-label" for="auto-scale">Escala automática</label>
        </div>
      </div>
      <div>
        <button id="update-scale" class="btn btn-primary">Actualizar escala</button>
      </div>
      <div>
        <label>Nº de filas (rejilla):</label>
        <div class="input-group">
          <input type="number" id="rows-input" value="1" min="1" class="form-control">
          <div class="input-group-append">
            <button id="apply-grid" class="btn btn-secondary">Aplicar</button>
          </div>
        </div>
      </div>
    </div>

    <div id="status-message" class="mb-3"></div>

    <div id="canvas-container">
      <div id="canvas"
        style="background-image:url('/imagenes/fondo.jpg?t={{ timestamp }}'); height:{{ background.height * scale_factor }}px;">
        <img id="canvas-image" src="/imagenes/fondo.jpg?t={{ timestamp }}">
        {% for user_id, datos in usuarios.items() %}
        <div class="pantalla" data-id="{{ user_id }}" data-ancho="{{ datos.ancho_px }}" data-alto="{{ datos.alto_px }}"
          data-nombre="{{ user_id }}" style="width:{{ datos.canvas_width }}px;height:{{ datos.canvas_height }}px;
                    left:{{ datos.pos_x }}px;top:{{ datos.pos_y }}px;">
          <div class="etiqueta">{{ datos.nombre }}</div>
          <small>{{ datos.ancho_px }}×{{ datos.alto_px }}px</small>
        </div>
        {% endfor %}
      </div>

      <div class="zoom-controls">
        <button class="zoom-btn" id="zoom-in">+</button>
        <button class="zoom-btn" id="zoom-out">–</button>
        <button class="zoom-btn" id="zoom-reset">↺</button>
      </div>

      <div class="fit-width-toggle">
        <input type="checkbox" id="fit-width" checked>
        <label for="fit-width">Ajustar al ancho</label>
      </div>

      <div class="users-panel">
        <h5>Usuarios</h5>
        <div id="users-list">
          {% for user_id, datos in usuarios.items() %}
          <div class="user-item" data-id="{{ user_id }}">{{ datos.nombre }}</div>
          {% endfor %}
        </div>
      </div>
    </div>

    <div class="mt-3">
      <button id="save-positions" class="btn btn-success">Guardar posiciones</button>
      <button id="generate-crops" class="btn btn-info">Generar recortes</button>
      <button id="test-crops" class="btn btn-secondary">Probar recortes</button>
    </div>

    <div id="crop-debug" class="mt-4"></div>
  </div>
  <script>
 const proto = window.location.protocol === "https:" ? "wss" : "ws";
  const host  = window.location.host;
  const wsAdmin = new WebSocket(`${proto}://${host}/ws/admin`);

    wsAdmin.onopen  = () => console.log("🟢 WS Admin conectado");
    wsAdmin.onerror = e => console.error("❌ WS Admin error:", e);
  
    
    function enviarPosicionEnVivo(id, left, top, width, height) {
    if (wsAdmin.readyState !== WebSocket.OPEN) return;
    const canvasRect = document.getElementById("canvas").getBoundingClientRect();
    const pos_x_pct = left / canvasRect.width;
    const pos_y_pct = top  / canvasRect.height;

    // **DEBUG**: mira en consola
    console.log("→ Enviando update:", { user_id: id, pos_x_pct, pos_y_pct });

    wsAdmin.send(JSON.stringify({
      type:      "update",
      user_id:   id,
      pos_x_pct,  // normalizado [0..1]
      pos_y_pct
    }));
  }


  
    document.addEventListener("DOMContentLoaded", () => {
      const canvasContainer = document.getElementById("canvas-container");
      const canvas          = document.getElementById("canvas");
      const img             = document.getElementById("canvas-image");
      const pantallas       = Array.from(document.querySelectorAll(".pantalla"));
      const rowsInput       = document.getElementById("rows-input");
      const applyGrid       = document.getElementById("apply-grid");
      const fitChk          = document.getElementById("fit-width");
      const zoomIn          = document.getElementById("zoom-in");
      const zoomOut         = document.getElementById("zoom-out");
      const zoomRes         = document.getElementById("zoom-reset");
  
      let positions   = {},
          currentZoom = parseFloat(localStorage.getItem("previewZoom") || "1"),
          offsetX     = 0,
          offsetY     = 0,
          dragTgt     = null,
          originalH   = parseFloat(canvas.style.height) || 600;
  
      // — ESCALA & FIT WIDTH —
      function updateCanvasSize() {
        if (fitChk.checked) {
          canvas.style.backgroundSize = 'contain';
          img.onload = () => {
            const aspect = img.naturalHeight / img.naturalWidth;
            const w = canvasContainer.clientWidth;
            canvas.style.height = Math.min(w * aspect, window.innerHeight * .8) + 'px';
          };
          img.src = img.src;
        } else {
          canvas.style.backgroundSize = 'cover';
          canvas.style.height = Math.min(originalH * currentZoom, window.innerHeight * .8) + 'px';
        }
      }
      fitChk.onchange = updateCanvasSize;
      updateCanvasSize();
  
      // — GUARDAR / APLICAR ZOOM —
      function storeZoom() {
        localStorage.setItem("previewZoom", currentZoom);
      }
      function applyZoomToUsers() {
        pantallas.forEach(el => {
          const ow = +el.dataset.w0, oh = +el.dataset.h0;
          el.style.width  = ow * currentZoom + 'px';
          el.style.height = oh * currentZoom + 'px';
          const newL = +el.dataset.l0 * currentZoom;
          const newT = +el.dataset.t0 * currentZoom;
          el.style.left = newL + 'px';
          el.style.top  = newT + 'px';
          positions[el.dataset.id] = { pos_x:newL, pos_y:newT };
        });
      }
      zoomIn.onclick = () => { currentZoom = Math.min(currentZoom+0.1,3); applyZoomToUsers(); storeZoom(); };
      zoomOut.onclick= () => { currentZoom = Math.max(currentZoom-0.1,0.5); applyZoomToUsers(); storeZoom(); };
      zoomRes.onclick= () => { currentZoom = 1; applyZoomToUsers(); storeZoom(); };
      canvas.onwheel  = e => {
        e.preventDefault();
        currentZoom = e.deltaY<0
          ? Math.min(currentZoom+0.1,3)
          : Math.max(currentZoom-0.1,0.5);
        applyZoomToUsers();
        storeZoom();
      };
  
      // — DISTRIBUIR EN REJILLA —
      function distribuirEnRejilla() {
        const R = Math.max(1,+rowsInput.value),
              N = pantallas.length,
              cols = Math.ceil(N/R),
              cw = canvas.clientWidth,
              ch = canvas.clientHeight,
              cellW = cw/cols,
              cellH = ch/R;
  
        pantallas.forEach((el,i) => {
          const row = Math.floor(i/cols),
                col = i%cols,
                w_px = +el.dataset.ancho,
                h_px = +el.dataset.alto,
                w_adj = cellW * .9,
                h_adj = w_adj * (h_px/w_px),
                left  = col*cellW + (cellW-w_adj)/2,
                top   = row*cellH + (cellH-h_adj)/2;
  
          el.style.width  = w_adj + 'px';
          el.style.height = h_adj + 'px';
          el.style.left   = left + 'px';
          el.style.top    = top  + 'px';
          positions[el.dataset.id] = { pos_x:left, pos_y:top };
        });
      }
      distribuirEnRejilla();
      applyGrid.onclick = distribuirEnRejilla;
  
      // — INICIALIZAR DATOS ORIGINALES + APLICAR ZOOM —
      pantallas.forEach(el => {
        el.dataset.w0 = parseFloat(el.style.width);
        el.dataset.h0 = parseFloat(el.style.height);
        el.dataset.l0 = parseFloat(el.style.left);
        el.dataset.t0 = parseFloat(el.style.top);
      });
      applyZoomToUsers();
  
      // — DRAG & DROP —
      function startDrag(e) {
        const el = e.target.closest('.pantalla');
        if (!el) return;
        dragTgt = el;
        const r = el.getBoundingClientRect();
        offsetX = e.clientX - r.left;
        offsetY = e.clientY - r.top;
        el.classList.add('dragging');
      }
      function dragMove(e) {
        if (!dragTgt) return;
        const cont = canvasContainer.getBoundingClientRect();
        let left = e.clientX - cont.left - offsetX,
            top  = e.clientY - cont.top  - offsetY;
        left = Math.min(Math.max(0,left), cont.width - dragTgt.offsetWidth);
        top  = Math.min(Math.max(0,top),  cont.height- dragTgt.offsetHeight);
        dragTgt.style.left = left + 'px';
        dragTgt.style.top  = top  + 'px';
        positions[dragTgt.dataset.id] = { pos_x:left, pos_y:top };
        enviarPosicionEnVivo(
          dragTgt.dataset.id,
          left, top,
          dragTgt.offsetWidth,
          dragTgt.offsetHeight
        );
      }
      function endDrag() {
        if (dragTgt) dragTgt.classList.remove('dragging');
        dragTgt = null;
      }
      canvas.addEventListener('mousedown', startDrag);
      document.addEventListener('mousemove', dragMove);
      document.addEventListener('mouseup',   endDrag);
      // touch
      canvas.addEventListener('touchstart', e=>{
        const t=e.touches[0];
        startDrag(new MouseEvent('mousedown',{clientX:t.clientX,clientY:t.clientY}));
      });
      document.addEventListener('touchmove', e=>{
        if (!dragTgt) return;
        e.preventDefault();
        const t=e.touches[0];
        dragMove(new MouseEvent('mousemove',{clientX:t.clientX,clientY:t.clientY}));
      },{passive:false});
      document.addEventListener('touchend', endDrag);
    });
  </script>
  
  
  
  
</body>

</html>
