<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista de {{ nombre }}</title>
  <link rel="stylesheet" href="/static/styles.css">
  <style>
    /* --------------------------------------------------
       Estilos básicos de tu layout de usuario
       -------------------------------------------------- */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    .user-content {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: #fff;
    }

    /* --------------------------------------------------
       Contenedor del recorte a pantalla completa
       -------------------------------------------------- */
    #recorte-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      flex: 1; /* ocupa todo el alto restante */
      background: #000; /* para visualizar márgenes vacíos */
    }

    /* --------------------------------------------------
       La imagen de fondo “viviente” que se traslada
       -------------------------------------------------- */
    #fondo-live {
      position: absolute;
      top: 0;
      left: 0;
      /* ancho y alto los ajustamos por JS */
    }

    /* --------------------------------------------------
       Resto de tu layout: HTML dinámico y QR
       -------------------------------------------------- */
    #content {
      padding: 15px;
      background: #fafafa;
      overflow: auto;
    }

    .qr-code {
      text-align: center;
      padding: 10px;
      background: #fff;
    }
    .qr-code img {
      max-width: 200px;
      background: #fff;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 5px;
    }

    .reload-btn {
      margin: 10px auto;
      padding: 8px 15px;
      background: #f0f0f0;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
    }
    .reload-btn:hover {
      background: #e0e0e0;
    }
  </style>

  <script>

document.addEventListener("DOMContentLoaded", () => {
    const fondo = document.getElementById("fondo-live");
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const ws    = new WebSocket(`${proto}://${location.host}/ws/user/{{ user_id }}`);

    ws.onopen = () => console.log("🟢 WS Usuario conectado");
    ws.onerror = e  => console.error("❌ WS Usuario error:", e);

    ws.onmessage = ({ data }) => {
      console.log("← Mensaje recibido en user:", data);
      const msg = JSON.parse(data);

      if (msg.type === "fondo") {
        fondo.src = msg.url;
        return;
      }
      if (msg.type === "update") {
        // … tu lógica de mover la imagen …
        const canvasEl = document.querySelector("#canvas");
        const { width, height } = canvasEl.getBoundingClientRect();
        fondo.style.width  = width  + "px";
        fondo.style.height = height + "px";

        const dx = msg.pos_x_pct * width;
        const dy = msg.pos_y_pct * height;
        fondo.style.left = `-${dx}px`;
        fondo.style.top  = `-${dy}px`;
      }
    };
  });
    // Función para recargar manualmente el fondo
    function reloadImage() {
      const img = document.getElementById("fondo-live");
      img.src = img.src.split('?')[0] + '?t=' + Date.now();
    }
  </script>
</head>

<body>
  <div class="user-content">

    <!-- 1) Recorte “live” a pantalla completa -->
    <div id="recorte-container">
      <img id="fondo-live" src="/imagenes/fondo.jpg?t={{ timestamp }}" alt="Mapa en vivo">
    </div>

    <!-- 2) Botón para forzar recarga si fuese necesario -->
    <button class="reload-btn" onclick="reloadImage()">Actualizar imagen</button>

    <!-- 3) Contenido HTML personalizado -->
    <div id="content">
      {{ html_content | safe }}
    </div>

    <!-- 4) Tu QR personal -->
    <div class="qr-code">
      <h3>Tu código QR personal</h3>
      <img src="{{ qr_code }}" alt="QR de {{ nombre }}">
      <p>Escanea este código para acceder rápidamente a tu vista</p>
    </div>

  </div>
</body>

</html>
